# Servidor do site. Substitui /etc/nginx/conf.d/default.conf da imagem nginx-unprivileged.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/site;
    index index.html;
    charset utf-8;

    # Atrás de proxy: redireciona com caminho relativo e sem a porta interna.
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json;

    error_page 404 /404.html;

    # Saúde do container (HEALTHCHECK e orquestradores).
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Páginas: sempre revalidadas, para uma versão nova aparecer na hora.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # CSS, JS e imagens: os nomes não mudam entre versões, então o cache é de um dia,
    # servido do cache por até uma semana enquanto revalida.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Nada de arquivos ocultos.
    location ~ /\. {
        return 404;
    }
}
