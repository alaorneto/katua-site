# Cabeçalhos de segurança, incluídos em cada location (um add_header dentro de uma location
# descarta os herdados do server, por isso o include em todas).
#
# CSP: o único script inline é o do <head> de index.html, que aplica o tema antes da pintura.
# Se ele mudar, troque o hash abaixo; o teste da imagem (docker/smoke-test.sh) confere.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-E2aoGwCp8IHc1WCNRIWfEGhkyaJf1GRuqT0L0pMvk+0='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
