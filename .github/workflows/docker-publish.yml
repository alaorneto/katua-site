# Publica a imagem do site no GitHub Container Registry.
# Disparado pela release do dev-workflow (release.dispatch_workflow em .github/dev-workflow.toml),
# na tag da versão, com os inputs version e tag. Pode ser rodado à mão para republicar uma tag.
name: Publicar imagem Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão sem o v (ex.: 0.1.0 ou 0.2.0-beta.1)"
        required: true
        type: string
      tag:
        description: "Tag do git (ex.: v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publicar ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validar a versão
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
            echo "::error::versão inválida: $VERSION"; exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::a tag $TAG não corresponde à versão $VERSION"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Definir nome e tags da imagem
        id: meta
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="$image:$VERSION"
          case "$VERSION" in
            *-*)
              # Pré-release: só a tag exata e a do canal (beta, rc...).
              channel="${VERSION#*-}"; channel="${channel%%.*}"
              tags="$tags,$image:$channel"
              ;;
            *)
              # Versão final: X.Y.Z, X.Y e latest.
              tags="$tags,$image:${VERSION%.*},$image:latest"
              ;;
          esac
          {
            echo "image=$image"
            echo "tags=$tags"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Entrar no registro
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Preparar o build multiarquitetura
        run: docker buildx create --name multi --driver docker-container --use

      - name: Construir e publicar (amd64 e arm64)
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REVISION: ${{ steps.meta.outputs.revision }}
        run: |
          args=()
          IFS=',' read -ra list <<< "$TAGS"
          for t in "${list[@]}"; do args+=(--tag "$t"); done
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$REVISION" \
            "${args[@]}" \
            --push .

      - name: Testar a imagem publicada
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker pull "$IMAGE:$VERSION"
          bash docker/smoke-test.sh "$IMAGE:$VERSION"

      - name: Resumo
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Imagem publicada"
            echo
            echo "Tags: \`${TAGS//,/\`, \`}\`"
            echo
            echo '```sh'
            echo "docker run -d -p 8080:8080 $IMAGE:$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
